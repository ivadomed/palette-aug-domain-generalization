  - name: brats2024-glioma
    dataset: brats2024-glioma
    config: "${PROJECT_ROOT}/benchmark/02_tasks/brain_tumor/brats2024-glioma/5_scripts_brats2024-glioma/06_evaluate/configs/brats_combined_01_results.yaml"
