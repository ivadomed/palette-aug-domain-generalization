# GIN-IPA arm dispatch plan (ginipa.sh runtable reads it): unit | cluster | segments | seg_time | members (setting:fold[@gpu])
# Rules: ONE fold per GPU (GIN-IPA ~2.7-2.9x the parent's memory); TamIA = whole h100:4 nodes for the LONG folds (Glioma 2500 epochs,
# Brain 2000 epochs, critical path) + open-ms FLAIR on the 3 GPUs left; Killarney L40S = the settings whose data is staged there (HCC,
# pancreas); Vulcan L40S = everything else (all data on Vulcan). Segments of 23:59 chained afterany, resume from checkpoint_latest at
# runtime; the last segment is a spare (exits at once when every fold has checkpoint_final). Segment counts from the sizing probe
