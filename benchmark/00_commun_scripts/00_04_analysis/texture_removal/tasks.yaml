# "Texture removed at test time" experiment (2026-11-02): the 9 ablation tasks (all but Spine), ONE training contrast
# each (the task's first/primary training contrast, as listed first in the paper's ladder panels), folds 0-2, two
# models: rung 4.5 flat fill (ladder_flat_rung.yaml) and rung 5 texture fill (PA alone, val000) -- the run_keys[4] /
# run_keys[5] of each task's ladder_series.json (checked by build_pack.py). Items = the ladder's OUT-OF-DOMAIN pool
# only, from the exact input dirs the original predictions used (each original fold0/<item>/predict_from_raw_data_args
# .json names its source folder; chaos amos/sliver07 = the crop-before-predict crops, breast = *_uniap, pancreas
# companions = their per-case FOV-cropped converter output, mandible = the S-I flipped *_sif inputs).
#
# item fields: key (unique in the task: <dataset>__<item>), item (the dataset's own item name), input (dir of
# <case>_0000.nii.gz). The texture-removed copy is a NEW TEST ITEM in the standard layout: <input>_texrm (a symlink to
# the generated dir under work_root), predicted by the shared drivers with PREDICT_INPUT_SUFFIX=_texrm
# PREDICT_OUTPUT_SUBDIR=texrm (-> <run>/fold{k}/texrm/<item>/); chaos amos/sliver07 crops instead go to a crop-reuse
# dir work_root/fovcrop/<dataset>/t1in/imagesTs_<item> (kept for fov_crop_predict_evaluate.sh's own layout).
# crop_source (chaos amos/sliver07): the crop-before-predict crops the ladder predictions used; prepare.py exposes them
# as the test item <item>_fovcrop (symlink) so the dataset's own cross-mode predict shim can read them.
# passthrough: in-domain items a dataset's evaluator always scores (hard-coded item lists); 05_evaluate.sh links
# fold{k}/texrm/<item> to the ORIGINAL predictions so the evaluator runs unchanged -- the analysis never reads them.
# Metrics of the texture-removed predictions land next to the originals as <category>_<RUN_ID>_texrm (Mandible:
# <metrics>/texture_removal/<category>_<RUN_ID>, its evaluators have no CKPT_TAG).

work_root: /scratch/paulh/texture_removal_test
partition: {k: 4, cells: 6}

