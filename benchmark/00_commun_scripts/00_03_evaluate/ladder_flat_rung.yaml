# Rung 4.5 (FLAT fill) registry for ladder_ood_common.py (added 2026-10-14).
# The paper's tested step is flat fill -> real fill (only the within-region texture term differs), so every
# ladder whose noise-fill rung (rung 4, label_voronoi "lblvor" run) is registered here gets a "flat fill"
# rung inserted between that rung and the real-fill rung; _find_fill_swap_idx then tests flat -> real.
# key = rung-4 RUN_ID, value = flat-fill RUN_ID (trained by scripts/cluster/rung45_flat/; atlas by its own 04_16).
# The engine substitutes the RUN_ID inside the rung-4 run key (keeping ablations/ prefixes and per-source
# run_subdirs) and refuses to run if the flat key does not resolve in every source where rung 4 does.
# A ladder whose rung 4 is NOT registered raises (never a silent 7-rung ladder); a rung-4 RUN_ID with genuinely no
# flat-fill run goes under no_flat_rung: (list, suffix match) instead.
# Disable for one run with LADDER_FLAT_RUNG=0 (reproduces the 7-rung ladders).
