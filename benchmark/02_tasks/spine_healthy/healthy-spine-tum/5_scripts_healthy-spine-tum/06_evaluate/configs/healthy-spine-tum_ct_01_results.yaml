# metrics_dir is an absolute path (not ${METRICS_ROOT}) because this dataset has
# no 00_utils/env.sh yet to export it — see the project notes' ${METRICS_ROOT}
# cleanup note for why an unset/unquoted version of that variable is dangerous.
