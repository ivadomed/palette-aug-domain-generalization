      synthseg_noEM: pansegdata_t1wce_synthseg_noEM_20261004_213948
      synthseg_EM: pansegdata_t1wce_synthseg_EM_20261004_214021
      auglab_default: pansegdata_t1wce_auglab_default_20261004_213915
      srcsm: pansegdata_t1wce_srcsm_20261004_214055
      auglabAug_v26_6_2_train050_val000: pansegdata_t1wce_auglabAug_v26_6_2_train050_val000_20261005_201307
      auglabAug_v26_6_2_train050_val100: pansegdata_t1wce_auglabAug_v26_6_2_train050_val100_20261005_201307
