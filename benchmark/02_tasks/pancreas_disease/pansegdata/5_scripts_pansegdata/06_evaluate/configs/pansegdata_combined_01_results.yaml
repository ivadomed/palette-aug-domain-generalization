# pansegdata -- all training contrasts pooled, cross-contrast (combined_modality_summary.py).
# Generated by write_configs_from_roster.py from roster_run_ids.tsv, then HAND-EDITED 2026-10-07 to add the external cohort `totalsegmri-pancreas` (TotalSegmentator MRI v2) as extra
# test columns (`sources:` + `contrast_groups`, same mechanism as ispy2). Do NOT rerun 06_05_write_configs.sh --force without re-adding it. Cross-DATASET evidence:
#   totalseg_t2like (n=12) has the same contrast as t2w -> pooled into the t2w column; totalseg_t1gre (n=97; T1 GRE, contrast phase unknown) is NOT assumed equal to t1wce -> its own column.
#   Pending: the amos-pancreas companion (item mixed_t1) is added by the session that owns it.
title: "pansegdata -- combined training contrasts (t1wce + t2w), cross-contrast"
output_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/pansegdata/8_results_pansegdata/02_metrics/pansegdata_model/combined_contrasts"
output_prefix: "01_results"
ref: auglabAug_v26_6_2_train050_val000
column_order: [t1wce, t2w, totalseg_t1gre]

contrast_groups:
  t1wce: t1wce
  t2w: [t2w, totalseg_t2like]
  totalseg_t1gre: totalseg_t1gre

